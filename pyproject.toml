[build-system]
requires = ["uv_build >= 0.13, <0.14"]
build-backend = "uv_build"

[project]
name = "torchdish"
version = "0.0.1"
authors = [
    { name = "Barry Yu", email = "barryyu28@gmail.com" },
]
description = "A framework for NCA-based computing in PyTorch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch", 
    "torchvision",
    "einops",
    "numpy",
    "tqdm",
    "matplotlib"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/realBarry123/torchdish"
Issues = "https://github.com/realBarry123/torchdish/issues"